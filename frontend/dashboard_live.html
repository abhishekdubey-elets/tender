<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GovIntel Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f7fa;--surface:#fff;--surface-2:#eef1f6;--surface-3:#e7ebf2;--border:#dde3ec;--border-strong:#c9d2e0;
  --text:#182030;--muted:#5c6677;--faint:#8b95a6;--accent:#3b3fc4;--accent-weak:#e9eafb;--accent-ink:#2a2ea0;
  --good:#1a8f4c;--good-weak:#e2f3e8;--warn:#a86a12;--warn-weak:#f6eddb;--bad:#c0392b;--bad-weak:#f7e5e2;
  --fact:#0f766e;--fact-weak:#dcefed;--infer:#a15c00;--infer-weak:#f6ebd9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e131e;--surface:#161c2a;--surface-2:#1b2331;--surface-3:#222c3d;--border:#293345;--border-strong:#354158;
  --text:#e7ecf5;--muted:#9aa5b8;--faint:#6f7c92;--accent:#8b8ef7;--accent-weak:#242c47;--accent-ink:#b6b8fb;
  --good:#43c07a;--good-weak:#17301f;--warn:#e0a94a;--warn-weak:#33280f;--bad:#e8695a;--bad-weak:#361a16;
  --fact:#4bb5aa;--fact-weak:#123028;--infer:#d9a24e;--infer-weak:#332512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:1200px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#6a6ef0);display:grid;place-items:center;color:#fff;font-weight:700}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted)}.status b{color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px}
.dot.err{background:var(--bad)}
.filters{position:sticky;top:63px;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.filters .inner{max-width:1200px;margin:0 auto;padding:12px 22px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
select,input[type=search]{font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;min-width:120px;font-family:inherit}
input[type=range]{accent-color:var(--accent);width:110px}
.reset{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 12px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:20px 22px 80px}
.board-head{display:flex;align-items:baseline;gap:12px;margin:6px 0 16px}
.board-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;margin:0;color:var(--muted)}
.leads{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr 168px;overflow:hidden}
.card:hover{border-color:var(--border-strong)}
.col{padding:16px 18px;min-width:0}.col.mid{border-left:1px solid var(--border);border-right:1px solid var(--border)}
.col.right{background:var(--surface-2);display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;text-align:center}
.company{font-size:16px;font-weight:700;margin:0 0 2px}
.evline{font-size:13.5px;margin:0 0 8px}.evline .etype{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}.meta .k{color:var(--faint)}
.value{color:var(--good);font-weight:600}
.k-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;margin:0 0 2px}
.opp{font-size:14px;font-weight:600;margin:0 0 3px}
.whynow{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.reason-mini{font-size:12.5px;color:var(--muted);margin:0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.badge.infer{background:var(--infer-weak);color:var(--infer)}.badge.fact{background:var(--fact-weak);color:var(--fact)}
.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--grade) calc(var(--p)*1%),var(--surface-3) 0)}
.ring .in{width:55px;height:55px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.ring .num{font-size:19px;font-weight:700}.ring .den{font-size:10px;color:var(--faint)}
.grade{font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px}
.g-A{--grade:var(--good)}.g-A.grade{background:var(--good-weak);color:var(--good)}
.g-B{--grade:#3a9bd6}.g-B.grade{background:#dcecf7;color:#1f6ea3}
.g-C{--grade:var(--warn)}.g-C.grade{background:var(--warn-weak);color:var(--warn)}
.g-D{--grade:#d0762e}.g-D.grade{background:var(--infer-weak);color:var(--infer)}
.g-F{--grade:var(--bad)}.g-F.grade{background:var(--bad-weak);color:var(--bad)}
.confline{font-size:11.5px;color:var(--muted)}
.statuspill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-weak);color:var(--accent-ink)}
.view{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;width:100%}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(12,18,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);z-index:50;background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .24s;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--surface)}
.panel-head .co{font-size:18px;font-weight:700;margin:0}.panel-head .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.score-chip{margin-left:auto;text-align:right}.score-chip .big{font-size:24px;font-weight:700}
.closebtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px}
.panel-body{overflow-y:auto;padding:6px 20px 20px;flex:1}
.sec{padding:16px 0;border-bottom:1px solid var(--border)}.sec:last-child{border-bottom:none}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--faint)}.kv dd{margin:0}
.ev{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--border)}.ev:first-child{border-top:none}
.ev .fid{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);width:26px}
.ev .stmt{font-size:13.5px;margin:0 0 3px}.ev .src{font-size:12px}
.reasoning{font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.assum{font-size:13px;margin:2px 0}.assum .tag{font-weight:600;color:var(--infer)}
.comp{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.comp small{display:block;color:var(--faint);font-size:11px}
.track{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}
.pts{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.brief-sec{margin:0 0 12px}.brief-sec h4{font-size:13px;margin:0 0 2px;display:flex;gap:7px;align-items:center}
.brief-sec p{font-size:13px;margin:0;white-space:pre-line}
.inf{font-size:10px;font-weight:600;color:var(--infer);background:var(--infer-weak);padding:1px 6px;border-radius:5px;text-transform:uppercase}
.risk{background:var(--warn-weak);border-radius:10px;padding:12px 14px}.risk p{white-space:pre-line;font-size:13px;margin:0}
.doc{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--border);font-size:13px}.doc:first-child{border-top:none}
.doc .kind{font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:1px 6px;border-radius:5px}
.feedback{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px}
.fb{font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.fb:hover{border-color:var(--border-strong)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-size:13px;padding:10px 16px;border-radius:10px;z-index:80;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.card{grid-template-columns:1fr}.col.mid{border:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.col.right{flex-direction:row;flex-wrap:wrap;justify-content:space-between}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="mark">GI</div>
  <div class="brand"><h1>GovIntel Leads</h1><p>Live — companies that just won government money</p></div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><b id="shown">0</b> leads</div>
</div></header>

<div class="filters"><div class="inner">
  <div class="field"><label>Min score</label><input type="range" id="fScore" min="0" max="100" value="0" step="5"><span class="mono" id="fScoreVal" style="font-size:12px">0</span></div>
  <div class="field"><label>Sector</label><select id="fSector"><option value="">All</option></select></div>
  <div class="field"><label>Product</label><select id="fProduct"><option value="">All</option></select></div>
  <div class="field"><label>Event type</label><select id="fEvent"><option value="">All</option></select></div>
  <div class="field"><label>Government org</label><select id="fOrg"><option value="">All</option></select></div>
  <div class="field"><label>Status</label><select id="fStatus"><option value="">Any</option><option value="new">New</option><option value="qualified">Qualified</option><option value="contacted">Contacted</option><option value="meeting">Meeting booked</option><option value="disqualified">Not relevant</option></select></div>
  <div class="field"><label>Company</label><input type="search" id="fCompany" placeholder="Search…"></div>
  <button class="reset" id="reset">Reset</button>
</div></div>

<main>
  <div class="board-head"><h2>High-priority leads</h2><span id="note" style="font-size:13px;color:var(--faint)"></span></div>
  <div class="leads" id="leads"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="toast" id="toast"></div>

<script>
const API = "/api";
const KEY = "dev-local-key";           // local-dev API key (see backend/.env)
const H = {"X-API-Key": KEY, "Content-Type": "application/json"};
const el = id => document.getElementById(id);
const money = v => v==null ? "—" : (v>=1e7 ? "₹"+(v/1e7).toFixed(v>=1e8?0:1)+" cr" : "₹"+Number(v).toLocaleString("en-IN"));
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {score:0,sector:"",product:"",event_type:"",gov_org:"",status:"",company:""};
let filled=false;

async function api(path, opts){
  const r = await fetch(API+path, {headers:H, ...opts});
  if(!r.ok) throw new Error(r.status+" "+(await r.text()));
  return r.status===204 ? null : r.json();
}

function qs(){
  const p = new URLSearchParams();
  if(state.score) p.set("score_min", state.score);
  for(const k of ["sector","product","event_type","gov_org","status"]) if(state[k]) p.set(k, state[k]);
  if(state.company) p.set("company", state.company);
  return p.toString() ? "?"+p.toString() : "";
}

function fillFilters(leads){
  if(filled) return; filled=true;
  const uniq=(f)=>[...new Set(leads.map(f).filter(Boolean))].sort();
  const add=(id,vals)=>{el(id).innerHTML='<option value="">All</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join("")};
  add("fSector",uniq(l=>l.event.sector)); add("fProduct",uniq(l=>l.opportunity));
  add("fEvent",uniq(l=>l.event.type_label)); add("fOrg",uniq(l=>l.event.org));
}

function card(l){
  return `<article class="card" data-id="${l.id}">
    <div class="col">
      <h3 class="company">${esc(l.company)}</h3>
      <p class="evline"><span class="etype">${esc(l.event.type_label)}:</span> ${esc(l.event.title)}</p>
      <div class="meta"><span><span class="k">Value</span> <span class="value">${money(l.event.value)}</span></span>
        <span><span class="k">Gov org</span> ${esc(l.event.org)}</span>
        <span><span class="k">Sector</span> ${esc(l.event.sector||"—")}</span>
        <span><span class="k">Dated</span> ${esc(l.event.date||"—")}</span></div>
    </div>
    <div class="col mid">
      <p class="k-lbl">Opportunity</p>
      <p class="opp">${esc(l.opportunity)} <span class="badge ${l.opportunity_tier==='inference'?'infer':'fact'}">${esc(l.opportunity_tier)}</span></p>
      <p class="whynow"><b>Why now:</b> ${esc(l.why_now)}</p>
      <p class="k-lbl">Target contact</p>
      <p class="reason-mini" style="margin-bottom:8px">${esc(l.target_contact)}</p>
      <p class="reason-mini"><b>Reason to call:</b> ${esc(l.reason_to_call)}</p>
    </div>
    <div class="col right">
      <div class="ring g-${l.grade}" style="--p:${l.score}"><div class="in"><span class="num mono">${l.score}</span><span class="den mono">/100</span></div></div>
      <span class="grade g-${l.grade}">Grade ${l.grade}</span>
      <span class="confline">confidence ${Math.round((l.confidence||0)*100)}%</span>
      <span class="statuspill">${esc(l.status)}</span>
      <button class="view">View lead</button>
    </div></article>`;
}

async function load(){
  try{
    const leads = await api("/leads"+qs());
    fillFilters(leads);
    el("status").innerHTML = `<span class="dot"></span><b>${leads.length}</b> leads`;
    el("shown") && (el("shown").textContent = leads.length);
    el("note").textContent = leads.length ? "sorted by score, highest first" : "";
    el("leads").innerHTML = leads.length ? leads.map(card).join("")
      : `<div class="empty">No leads match these filters.</div>`;
  }catch(e){
    el("status").innerHTML = `<span class="dot err"></span>API error`;
    el("leads").innerHTML = `<div class="empty">Could not load leads (${esc(e.message)}).<br>Check the API is running and the key is valid.</div>`;
  }
}

function detailHTML(l){
  const ev=l.event, od=l.opportunity_detail||{}, cp=l.company_profile||{};
  const kv=r=>`<dl class="kv">${r.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const host=u=>{try{return new URL(u).host}catch{return u}};
  const evi=(l.evidence||[]).map(e=>`<div class="ev"><span class="fid">${esc(e.id)}</span><div>
     <p class="stmt">${esc(e.statement)} <span class="badge ${e.tier==='fact'?'fact':'infer'}">${esc(e.tier)}</span></p>
     <div class="src">${e.source_url?`<a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(host(e.source_url))} ↗</a>`:"no URL"}${e.confidence!=null?` · conf ${e.confidence.toFixed(2)}`:""}</div></div></div>`).join("");
  const comps=(l.score_components||[]).map(c=>`<div class="comp"><div>${esc(c.key)}<small>${esc(c.note||"")}</small></div>
     <div class="track"><div class="fill" style="width:${Math.round(c.points/c.max_points*100)}%"></div></div>
     <div class="pts">${c.points}/${c.max_points}</div></div>`).join("");
  const contact = l.contact ? kv([["Name",esc(l.contact.name)+(l.contact.verified?' <span class="badge fact">verified</span>':'')],
     ["Title",esc(l.contact.title||"—")],["Email",l.contact.email?`<a href="mailto:${esc(l.contact.email)}">${esc(l.contact.email)}</a>`:"—"],
     ["LinkedIn",l.contact.linkedin?`<a href="${esc(l.contact.linkedin)}" target="_blank" rel="noopener">profile ↗</a>`:"—"]])
     : `<p style="font-size:13.5px;margin:0">No verified contact — target roles: ${esc((od.job_titles||[]).join(", ")||"decision-makers")}.</p>`;
  const brief=(l.brief||[]).map(b=>`<div class="brief-sec"><h4>${esc(b.title)} ${b.is_inference?'<span class="inf">inferred</span>':''}</h4><p>${esc(b.text)}</p></div>`).join("");
  const docs=(l.sources||[]).map(d=>`<div class="doc"><span class="kind">${esc(d.kind||"doc")}</span><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)} ↗</a></div>`).join("");
  return `<div class="panel-head"><div><p class="co">${esc(l.company)}</p>
      <p class="sub">${esc(ev.type_label)} · ${esc(ev.org)} · <span class="statuspill" id="stpill">${esc(l.status)}</span></p></div>
      <div class="score-chip"><div class="big mono g-${l.grade}" style="color:var(--grade)">${l.score}</div><span class="grade g-${l.grade}">Grade ${l.grade}</span></div>
      <button class="closebtn" id="close">✕</button></div>
    <div class="panel-body">
      <div class="sec"><h3>1 · Government event</h3>${kv([["Event",esc(ev.title)],["Value",`<span class="value">${money(ev.value)}</span>`],["Government org",esc(ev.org)],["Department",esc(ev.department||"—")],["Sector",esc(ev.sector||"—")],["Date",esc(ev.date||"—")],["Reference",`<span class="mono">${esc(ev.reference||"—")}</span>`],["Location",esc(ev.location||"—")]])}</div>
      <div class="sec"><h3>2 · Evidence — every claim links to its source</h3>${evi||"—"}</div>
      <div class="sec"><h3>3 · Company profile</h3><p style="font-size:13.5px;margin:0 0 10px">${esc(cp.description||"")}</p>${kv([["Industry",esc(cp.industry||"—")],["HQ",esc(cp.hq||"—")],["Employees",esc(cp.size||"—")],["Revenue",cp.revenue?money(cp.revenue):"—"],["Website",cp.website?`<a href="${esc(cp.website)}" target="_blank" rel="noopener">${esc(host(cp.website))} ↗</a>`:"—"]])}</div>
      <div class="sec"><h3>4 · Opportunity reasoning</h3><p style="font-size:14px;font-weight:600;margin:0 0 6px">${esc(l.opportunity)} — ${esc(od.need||"")} <span class="badge ${l.opportunity_tier==='inference'?'infer':'fact'}">${esc(l.opportunity_tier)}</span></p>
        <p class="reasoning">${esc(od.reasoning||"")}</p>
        ${(od.assumptions||[]).map(a=>`<p class="assum"><span class="tag">Assumption:</span> ${esc(a)}</p>`).join("")}
        ${(od.alternatives||[]).map(a=>`<p class="assum"><span class="tag" style="color:var(--muted)">Alternative:</span> ${esc(a)}</p>`).join("")}
        <p style="font-size:12.5px;color:var(--faint);margin-top:8px">Timing ${esc(od.timing||"—")}</p></div>
      <div class="sec"><h3>5 · Score breakdown — why ${l.score}/100</h3>${comps}</div>
      <div class="sec"><h3>6 · Contact</h3>${contact}</div>
      <div class="sec"><h3>7 · AI sales brief</h3>${brief}${l.risk?`<div class="risk"><h4 style="margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--warn)">Risk / uncertainty</h4><p>${esc(l.risk)}</p></div>`:""}</div>
      <div class="sec"><h3>8 · Source documents</h3>${docs||"—"}</div>
      <div class="sec"><h3>9 · Feedback</h3><p style="font-size:12.5px;color:var(--muted);margin:0">Your feedback tunes scoring & flags data quality. No CRM connected.</p></div>
    </div>
    <div class="feedback">
      ${[["good","👍 Good lead","lead_accepted"],["bad","👎 Bad lead","lead_rejected"],["c","📞 Contacted","contacted"],["m","📅 Meeting booked","meeting_booked"],["nr","🚫 Not relevant","not_relevant"],["oc","✨ Opportunity created","opportunity_created"]].map(([k,label,ft])=>`<button class="fb" data-ft="${ft}">${label}</button>`).join("")}
    </div>`;
}

async function openDetail(id){
  try{
    const l = await api("/leads/"+id);
    const p = el("panel"); p.innerHTML = detailHTML(l); p.classList.add("open"); el("scrim").classList.add("open");
    p.querySelector("#close").onclick = close;
    p.querySelectorAll(".fb").forEach(b=>b.onclick=async()=>{
      try{ const r=await api("/leads/"+id+"/feedback",{method:"POST",body:JSON.stringify({event_type:b.dataset.ft})});
        p.querySelector("#stpill").textContent=r.status; toast(`Recorded: ${b.textContent.trim()} → “${r.status}”`); load();
      }catch(e){ toast("Feedback failed: "+e.message) }
    });
    p.querySelector(".panel-body").scrollTop=0;
  }catch(e){ toast("Could not open lead: "+e.message) }
}
function close(){ el("panel").classList.remove("open"); el("scrim").classList.remove("open"); }

el("leads").addEventListener("click",e=>{const c=e.target.closest("[data-id]"); if(c) openDetail(c.dataset.id)});
el("scrim").onclick=close; document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
el("fScore").oninput=e=>{state.score=+e.target.value; el("fScoreVal").textContent=e.target.value; load()};
for(const [id,key] of [["fSector","sector"],["fProduct","product"],["fEvent","event_type"],["fOrg","gov_org"],["fStatus","status"]])
  el(id).onchange=e=>{state[key]=e.target.value; load()};
el("fCompany").oninput=e=>{state.company=e.target.value; load()};
el("reset").onclick=()=>{Object.assign(state,{score:0,sector:"",product:"",event_type:"",gov_org:"",status:"",company:""});
  ["fSector","fProduct","fEvent","fOrg","fStatus"].forEach(i=>el(i).value=""); el("fScore").value=0; el("fScoreVal").textContent="0"; el("fCompany").value=""; load()};
let tt; function toast(m){const t=el("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600)}
load();
</script>
</body>
</html>
