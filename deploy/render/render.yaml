# Render Blueprint — free Docker web service for the GovIntel backend.
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick this repo.
# It builds backend/ with deploy/huggingface/Dockerfile and serves from MongoDB Atlas.
services:
  - type: web
    name: govintel-backend
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/huggingface/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: USE_MONGO
        value: "true"
      - key: MONGODB_DB
        value: govintel
      # Secrets — set these in the Render dashboard (Environment), not here:
      - key: API_KEYS
        sync: false
      - key: MONGODB_URI
        sync: false
