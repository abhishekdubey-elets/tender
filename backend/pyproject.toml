[project]
name = "govintel"
version = "0.1.0"
description = "Government-event sales intelligence platform — database layer"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # LLM extraction (crawl: OpenAI preferred, Anthropic fallback)
    "openai>=1.40",
    "anthropic>=0.40",
    # read API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",  # WebSocket push (uvicorn ws impl); explicit so it can't be dropped
    "pymongo[srv]>=4.6",  # MongoDB Atlas serving path (USE_MONGO) + change streams
    # ingestion framework
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-postgresql>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional OCR backend for scanned PDFs. Also requires the Tesseract and
# Poppler system binaries.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
